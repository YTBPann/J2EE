<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng sản phẩm - EcoSwap</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <main class="container">
        <div class="form-container">
            <h2 class="section-title">Đăng sản phẩm mới</h2>

            <div th:if="${param.error}" class="alert alert-danger" style="margin-bottom: 1rem;">
                <span th:switch="${param.error[0]}">
                    <span th:case="'image_too_large'">Ảnh tải lên vượt quá dung lượng cho phép. Vui lòng chọn ảnh nhỏ hơn 25MB.</span>
                    <span th:case="*">Đã xảy ra lỗi khi tải ảnh sản phẩm.</span>
                </span>
            </div>
            
            <form th:action="@{/products/create}" th:object="${product}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="title">Tiêu đề *</label>
                    <input type="text" id="title" th:field="*{title}" required>
                </div>

                <div class="form-group">
                    <label for="category">Danh mục *</label>
                    <select id="category" name="categoryId" required>
                        <option value="">Chọn danh mục</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${product.category != null and product.category.id == cat.id}">Category</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="price">Giá (VNĐ) *</label>
                    <input type="number" id="price" th:field="*{price}" required min="0">
                </div>
                
                <div class="form-group">
                    <label for="condition">Tình trạng</label>
                    <select id="condition" th:field="*{condition}">
                        <option value="NEW">Mới</option>
                        <option value="LIKE_NEW">Như mới</option>
                        <option value="USED">Đã sử dụng</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="location">Địa điểm</label>
                    <input type="text" id="location" th:field="*{location}" placeholder="Ví dụ: Hà Nội, TP. HCM...">
                </div>
                
                <div class="form-group">
                    <label for="imageFile">Hình ảnh sản phẩm</label>
                    <input type="file" id="imageFile" name="imageFile" accept="image/*">
                    <p style="font-size: 12px; color: #999; margin-top: 5px;">Kích thước tối đa: 25MB.</p>
                </div>
                
                <div class="form-group">
                    <label for="description">Mô tả sản phẩm</label>
                    <textarea id="description" th:field="*{description}" rows="5" placeholder="Mô tả chi tiết về sản phẩm..."></textarea>
                </div>
                
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Đăng sản phẩm</button>
                    <a th:href="@{/}" class="btn btn-outline">Hủy</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        (function () {
            const fileInput = document.getElementById('imageFile');
            if (!fileInput) return;

            const maxSizeBytes = 25 * 1024 * 1024;
            fileInput.form?.addEventListener('submit', function (event) {
                const file = fileInput.files && fileInput.files[0];
                if (file && file.size > maxSizeBytes) {
                    event.preventDefault();
                    alert('Ảnh tải lên vượt quá 25MB. Vui lòng chọn ảnh nhỏ hơn.');
                }
            });
        })();
    </script>
    
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Về EcoSwap</h3>
                <p>Nền tảng mua bán và trao đổi đồ cũ uy tín, an toàn tại Việt Nam.</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 EcoSwap. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
